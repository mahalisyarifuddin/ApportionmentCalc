<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>ApportionmentCalc</title>
	<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;

				flex-basis: 100%;

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — ApportionmentCalc
		   1200px so the Hare and Sainte-Lague tables sit side by side; they stack

		:root {

		#hare, #sainteLague, #compare { overflow-x: auto; }

		#inputStats { text-align: right; }
		#list { margin-bottom: var(--sp-4); }

		.step {

		.actions {

		.info { font-size: .875rem; color: var(--text-muted); }

		dialog#modal {

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);
				if (!parts) return true;                       // named or hex: it paints
				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				} else {
					AppSettings.renderSettings();
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

	<script>
		const text = {
			en: {
				title: 'ApportionmentCalc',
				subtitle: 'Electoral seat allocation calculator: Sainte-Lagu\u00eb vs Hare Quota',
				themeAuto: 'Auto',
				themeLight: 'Light',
				themeDark: 'Dark',

		const elements = new Proxy({},{ get: (_,id)=>document.getElementById(id) });
		const STEPS_LIMIT = 50;
		const SUMMARY_LIMIT = 1000;

		class ApportionmentCalc {
			constructor() {
				this.parties = [];
				this.setup();
				this.theme('auto');
				this.language = AppSettings.detectLang(Object.keys(text));
				this.lang(this.language);

				if (this.loadState()) {
					this.calculate();
				} else {
					this.parties = Object.entries({
						Apple: 25000,
						Blueberry: 15000,
						Cherry: 9000,
						Date: 5000,
						Elderberry: 1500
					}).map(([n, v], i) => ({ id: i + 1, name: n + ' Party', votes: v }));
					this.nextIndex = 6;
					this.renderParties();
				}

				window.onhashchange = () => {
					if (this._skipHash) {
						this._skipHash = false;
					} else if (this.loadState()) {
						this.calculate();
					}
				};
			}

			loadState() {
				if (!location.hash) return false;
				try {
					const s = JSON.parse(decodeURIComponent(location.hash.slice(1)));
					if (!s?.seats || !s?.parties?.length) return false;

					elements.seats.value = s.seats;
					elements.threshold.value = s.threshold ?? 0;
					elements.hide.checked = !!s.hide;

					this.parties = s.parties.map((p, i) => ({ id: i + 1, name: p.name || '', votes: p.votes || 0 }));

					this.nextIndex = this.parties.length + 1;
					this.renderParties();
					return true;
				} catch (e) {
					return false;
				}
			}

			saveState() {
				const s = {
					seats: elements.seats.value,
					threshold: elements.threshold.value,
					hide: elements.hide.checked,
					parties: this.parties.map(p => ({ name: p.name, votes: p.votes }))
				};
				const h = encodeURIComponent(JSON.stringify(s));
				if (location.hash !== '#' + h) {
					this._skipHash = true;
					location.hash = h;
				}
			}

			setup() {
				const actions = {
					add: () => this.add(),
					clear: () => this.clear(),
					calculate: () => this.calculate(),
					edit: () => this.display('input'),
					steps: () => this.modal(true),
					close: () => this.modal(false),
					copy: () => this.copy(),
					export: () => this.export(),
					import: () => elements.file.click()
				};

				for (const [id, h] of Object.entries(actions)) {
					if (elements[id]) elements[id].onclick = h;
				}

				elements.file.onchange = e => this.load(e.target.files[0]);

				elements.modal.onclick = e => {
					const r = elements.modal.getBoundingClientRect();
					const inside = r.top <= e.clientY && e.clientY <= r.top + r.height && r.left <= e.clientX && e.clientX <= r.left + r.width;
					if (!inside) this.modal(false);
				};

				elements.modal.addEventListener('close', () => this.lastFocus?.focus());
				elements.language.onchange = e => this.lang(e.target.value);
				elements.theme.onchange = e => this.theme(e.target.value);

				elements.hide.onchange = () => {
					elements.results.classList.toggle('hide-failed', elements.hide.checked);
					this.saveState();
				};

				elements.input.oninput = () => {
					this.error();
					this.updateInputStats();
				};

				document.onkeydown = e => this.key(e);

				elements.list.onclick = e => {
					const r = e.target.closest('.party-row');
					if (!r || !e.target.matches('.danger')) return;

					this.remove(+r.dataset.id);
				};

				elements.list.onchange = e => {
					const r = e.target.closest('.party-row');
					if (!r) return;

					const p = this.parties.find(p => p.id === +r.dataset.id);
					if (!p) return;

					if (e.target.type === 'text') {
						p.name = e.target.value;
					} else {
						e.target.value = p.votes = Math.max(0, Math.round(+e.target.value) || 0);
					}
				};

				let dragCount = 0;
				document.body.ondragenter = e => {
					e.preventDefault();
					dragCount++;
					document.body.classList.add('drag-active');
				};
				document.body.ondragleave = e => {
					dragCount--;
					if (dragCount === 0) document.body.classList.remove('drag-active');
				};
				document.body.ondragover = e => e.preventDefault();
				document.body.ondrop = e => {
					e.preventDefault();
					dragCount = 0;
					document.body.classList.remove('drag-active');
					const f = e.dataTransfer.files[0];
					if (f) this.load(f);
				};
			}

			key(e) {
				if (e.key !== 'Enter') return;

				if (e.ctrlKey || e.metaKey) {
					document.activeElement?.blur();
					return this.calculate();
				}

				const r = e.target.closest?.('.party-row');
				if (!r) {
					if (e.target.matches?.('input')) {
						document.activeElement?.blur();
						this.calculate();
					}
					return;
				}

				if (!e.target.matches?.('input')) return;

				e.preventDefault();
				const p = this.parties.find(p => p.id === +r.dataset.id);
				if (p) {
					if (e.target.type === 'text') {
						p.name = e.target.value;
					} else {
						p.votes = Math.max(0, Math.round(+e.target.value) || 0);
					}
				}

				if (e.target.type === 'text') {
					e.target.nextElementSibling?.focus();
				} else if (r.nextElementSibling) {
					r.nextElementSibling.querySelector('input')?.focus();
				} else {
					this.add();
				}
			}

			string(k) { return text[this.language]?.[k] ?? k }

			format(v,o = {}) {
				this._fmt = this._fmt || {};
				const loc = this.language === 'id' ? 'id-ID' : 'en-US';
				const key = loc + JSON.stringify(o);
				this._fmt[key] = this._fmt[key] || new Intl.NumberFormat(loc, o);
				return this._fmt[key].format(v);
			}

			escapeHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') }
			table(h,b) { return `<table><thead><tr>${h.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table>` }

			theme(n) { AppSettings.applyTheme(n) }

			lang(l) {
				this.language = AppSettings.applyLang(l);

				Object.keys(text.en).forEach(k => {
					if (elements[k]) {
						elements[k].textContent = this.string(k);
					}
				});

				const ariaLabels = [['close', 'closeModal'], ['language', 'langLabel'], ['theme', 'themeLabel'], ['settingsBtn', 'prefBtn']];
				ariaLabels.forEach(([i, k]) => elements[i].setAttribute('aria-label', this.string(k)));

				this.renderParties();

				if (!elements.results.classList.contains('hidden') && this.data) {
					this.renderResults();
				}
			}

			display(s) {
				['input', 'results'].forEach(i => elements[i].classList.toggle('hidden', i !== s));
				if (s === 'results') {
					elements.results.setAttribute('tabindex', '-1');
					elements.results.focus();
				} else {
					elements.seats.focus();
				}
			}

			modal(v) {
				if (v) {
					this.lastFocus = document.activeElement;
					this.renderSteps();
					AppSettings.openSheet(elements.modal);
				} else {
					AppSettings.closeSheet(elements.modal);
				}
			}

			error(m) {
				elements.error.textContent = m || '';
				elements.error.classList.toggle('hidden', !m);
			}

			add() {
				this.error();
				this.parties.push({ id: this.nextIndex++, name: '', votes: 0 });
				this.renderParties();
				elements.list.lastElementChild?.querySelector('input')?.focus();
			}

			clear() {
				if (confirm(this.string('clearConfirm'))) {
					this.parties = [];
					this.renderParties();
					this.add();
					this.error();
				}
			}

			remove(i) {
				this.error();
				const idx = this.parties.findIndex(p => p.id === i);
				this.parties = this.parties.filter(p => p.id !== i);
				this.renderParties();

				const t = Math.min(idx, this.parties.length - 1);
				if (t >= 0) {
					elements.list.children[t]?.querySelector('.danger')?.focus();
				} else {
					elements.add.focus();
				}
			}

			updateInputStats() {
				let total = 0;
				const inputs = elements.list.querySelectorAll('input[type=number]');
				for (const input of inputs) {
					total += Math.max(0, Math.round(+input.value) || 0);
				}

				const threshold = parseFloat(elements.threshold.value.replace(',', '.')) || 0;
				const minVotes = total * threshold / 100;

				elements.inputStats.innerHTML = `${this.string('totalVotes')}: <strong>${this.format(total)}</strong> | ${this.string('thresholdVotes')} (${this.format(threshold)}%): <strong>${this.format(minVotes, { maximumFractionDigits: 2 })}</strong>`;
			}

			renderParties() {
				elements.list.innerHTML = this.parties.map((p, i) => `
						<div class="party-row" data-id="${p.id}">
							<input type="text" value="${this.escapeHtml(p.name)}" placeholder="${this.string('partyPlaceholder')}" aria-label="${this.string('partyPlaceholder')} ${i + 1}">
							<input type="number" value="${p.votes ?? ''}" placeholder="${this.string('votesPlaceholder')}" min="0" aria-label="${this.string('votesPlaceholder')} ${i + 1}">
							<button class="danger" aria-label="${this.string('removeParty')} ${i + 1}">×</button>
						</div>
					`).join('');
				this.updateInputStats();
			}

			load(f) {
				if (!f) return;

				elements.file.value = '';
				const r = new FileReader();
				r.onload = e => {
					try {
						this.parseCSV(e.target.result);
					} catch (err) {
						this.error(this.string('alertImport'));
					}
				};
				r.readAsText(f);
			}

			parseNumber(s) {
				if (!s) return 0;
				const clean = s.trim().replace(/\s/g, '');
				const num = parseFloat(clean.replace(this.language === 'id' ? /\./g : /,/g, '').replace(this.language === 'id' ? /,/ : /\./, '.'));
				return Math.max(0, Math.round(num) || 0);
			}

			parseCSV(t) {
				const lines = t.replace(/^\uFEFF/, '').split(/\r?\n/).filter(ln => ln.trim());
				if (!lines.length) throw new Error();

				const splitRegexes = {
					'\t': /\t(?=(?:(?:[^"]*"){2})*[^"]*$)/,
					';': /;(?=(?:(?:[^"]*"){2})*[^"]*$)/,
					',': /,(?=(?:(?:[^"]*"){2})*[^"]*$)/
				};
				const bestDelim = ['\t', ';', ','].reduce((a, b) => lines[0].split(splitRegexes[a]).length > lines[0].split(splitRegexes[b]).length ? a : b);

				const rx = splitRegexes[bestDelim];
				const parseLine = ln => ln.split(rx).map(c => c.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
				const header = parseLine(lines[0]);
				const isNumeric = c => /^\d+$/.test(c?.replace(/[.,\s]/g, ''));

				let nameIdx = header.findIndex(c => /party|partai|name|nama/i.test(c));
				let voteIdx = header.findIndex(c => /vote|suara/i.test(c));
				let start = 1;

				if (nameIdx < 0 || voteIdx < 0) {
					start = 0;
					voteIdx = header.findIndex(isNumeric);
					nameIdx = (voteIdx >= 0 && header.length === 2) ? 1 - voteIdx : header.findIndex(c => !isNumeric(c));
				}
				if (nameIdx < 0 || voteIdx < 0) throw new Error();

				const ps = [];
				for (let i = start; i < lines.length; i++) {
					const cols = parseLine(lines[i]);
					if (cols[nameIdx]) {
						ps.push({ id: this.nextIndex++, name: cols[nameIdx], votes: this.parseNumber(cols[voteIdx]) });
					}
				}
				if (!ps.length) throw new Error();
				this.parties = ps;
				this.error();
				this.renderParties();
			}

			calculate() {
				this.error();
				const s = Math.round(+elements.seats.value);
				const t = parseFloat(elements.threshold.value.replace(',', '.')) || 0;

				if (isNaN(s) || s < 1) {
					return this.error(this.string('alertSeats'));
				}

				const res = this.computeAllocation(s, t, this.parties);
				if (res.error) {
					return this.error(this.string(res.error));
				}

				this.saveState();
				this.data = res.data;
				this.renderResults();
				this.display('results');
			}

			computeAllocation(s, t, ps) {
				const valid = [];
				let tot = 0;
				for (const p of ps) {
					if (p.votes >= 0 && (p.name.trim() || p.votes > 0)) {
						const v = { ...p, name: p.name.trim() || `${this.string('party')} ${p.id}`, hare: 0, sainteLague: 0, remainder: 0 };
						valid.push(v);
						tot += v.votes;
					}
				}

				if (tot === 0) return { error: 'alertParties' };

				const min = tot * t / 100;
				const passed = [];
				let pt = 0;
				for (const p of valid) {
					if (p.votes >= min - 1e-7) {
						passed.push(p);
						pt += p.votes;
					}
				}

				if (!passed.length) return { error: 'belowThreshold' };

				let sumHare = 0;
				for (const p of passed) {
					p.hare = Math.floor(p.votes * s / pt);
					p.remainder = (p.votes * s % pt) / pt;
					p.divisor = 1;
					p.quotient = p.votes;
					sumHare += p.hare;
				}

				[...passed].sort((a, b) => b.remainder - a.remainder || b.votes - a.votes).slice(0, s - sumHare).forEach(p => p.hare++);

				const steps = [];
				for (let i = 0; i < s; i++) {
					let w = passed[0];
					for (let j = 1; j < passed.length; j++) {
						if (passed[j].quotient > w.quotient || (passed[j].quotient === w.quotient && passed[j].votes > w.votes)) {
							w = passed[j];
						}
					}
					if (i < SUMMARY_LIMIT) {
						steps.push({ round: i + 1, winner: w.name, winnerId: w.id, value: w.quotient, divisor: w.divisor, all: i < STEPS_LIMIT ? passed.map(({ id, name, quotient, divisor }) => ({ id, name, quotient, divisor })) : null });
					}
					w.sainteLague++;
					w.divisor += 2;
					w.quotient = w.votes / w.divisor;
				}

				const cg = (k) => {
					let sum = 0;
					for (const p of valid) {
						const diff = (p.votes / tot * 100) - (p[k] / s * 100);
						sum += diff * diff;
					}
					return Math.sqrt(0.5 * sum);
				};

				for (const p of valid) {
					p.passed = p.votes >= min - 1e-7;
				}

				return { data: { total: tot, minimumVotes: min, threshold: t, seats: s, quota: pt / s, steps, results: valid, hareIndex: cg('hare'), sainteLagueIndex: cg('sainteLague') } };
			}

			renderResults() {
				if (!this.data) return;

				elements.results.classList.toggle('hide-failed', elements.hide.checked);
				const d = this.data;

				const r = (res, count, extra = '') => {
					const pct = res.votes / d.total * 100;
					const formattedPct = this.format(pct, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
					return `<tr class="${res.passed ? '' : 'failed-party'}"><td role="rowheader">${this.escapeHtml(res.name)}</td><td>${this.format(res.votes)}</td><td class="gradient-bar" style="--percentage:${pct}%">${formattedPct}%</td><td><strong>${count}</strong></td>${extra}</tr>`;
				};

				elements.stats.innerHTML = `<div class="info">${this.string('totalVotes')}: ${this.format(d.total)}<br>${this.string('thresholdVotes')} (${this.format(d.threshold)}%): ${this.format(d.minimumVotes, { maximumFractionDigits: 2 })}</div>`;

				elements.hare.innerHTML = `<p class="info">${this.string('quota')}: ${this.format(d.quota)} | ${this.string('gallagher')}: ${this.format(d.hareIndex, { maximumFractionDigits: 4 })}</p>`
					+ this.table([...['party', 'votes', 'share', 'seatsColumn'].map(k => this.string(k)), this.string('remainder')], [...d.results]
						.sort((a, b) => b.hare - a.hare || b.votes - a.votes)
						.map(res => r(res, res.hare, `<td>${this.format(res.remainder, { maximumFractionDigits: 6 })}</td>`))
						.join(''));

				elements.sainteLague.innerHTML = `<p class="info">${this.string('divisorsText')} | ${this.string('gallagher')}: ${this.format(d.sainteLagueIndex, { maximumFractionDigits: 4 })}</p>`
					+ this.table(['party', 'votes', 'share', 'seatsColumn'].map(k => this.string(k)), [...d.results]
						.sort((a, b) => b.sainteLague - a.sainteLague || b.votes - a.votes)
						.map(res => r(res, res.sainteLague))
						.join(''));

				elements.compare.innerHTML = this.table([this.string('party'), this.string('votes'), this.string('share'), 'Hare', 'Sainte-Lagu\u00eb', this.string('diff')], [...d.results]
					.sort((a, b) => b.votes - a.votes)
					.map(res => {
						const diff = res.sainteLague - res.hare;
						const pct = this.format(res.votes / d.total * 100, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
						const diffClass = diff > 0 ? 'positive' : diff < 0 ? 'negative' : 'neutral';
						const diffStr = diff > 0 ? '+' + diff : diff;
						return `<tr class="${res.passed ? '' : 'failed-party'}"><td role="rowheader">${this.escapeHtml(res.name)}</td><td>${this.format(res.votes)}</td><td>${pct}%</td><td>${res.hare}</td><td>${res.sainteLague}</td><td class="${diffClass}">${diffStr}</td></tr>`;
					})
					.join(''));
			}

			renderSteps() {
				const d = this.data;
				if (!d?.steps?.length) return;

				const sum = d.steps.slice(0, SUMMARY_LIMIT);
				const sumW = d.seats > SUMMARY_LIMIT ? `<p class="info mt-md italic">${this.string('summaryLimited').replace('{n}', SUMMARY_LIMIT)}</p>` : '';
				const det = d.steps.slice(0, STEPS_LIMIT);
				const detW = d.steps.length > STEPS_LIMIT ? `<p class="info mt-md italic">${this.string('detailsLimited').replace('{n}', STEPS_LIMIT)}</p>` : '';
				const st = this.string('seatAllocated');
				const wp = this.string('winnerPrefix');
				const opt = { minimumFractionDigits: 2, maximumFractionDigits: 6 };

				const sumTable = this.table(['round', 'winner', 'quotient', 'divisor'].map(k => this.string(k)), sum
					.map(s => `<tr><td>${st.replace('{n}', s.round)}</td><td><strong>${this.escapeHtml(s.winner)}</strong></td><td>${this.format(s.value, opt)}</td><td>${s.divisor}</td></tr>`).join(''));

				const detSteps = det.map(s => {
					if (!s.all) return '';
					const stepTitle = `<h4>${st.replace('{n}', s.round)} - ${wp}${this.escapeHtml(s.winner)}</h4>`;
					const stepTable = this.table(s.all.map(q => `${this.escapeHtml(q.name)} (/${q.divisor})`), `<tr>${s.all.map(q => `<td class="${q.id === s.winnerId ? 'highlight' : ''}">${this.format(q.quotient, opt)}</td>`).join('')}</tr>`);
					return `<div class="step">${stepTitle}${stepTable}</div>`;
				}).join('');

				elements.modalSteps.innerHTML = sumTable + sumW + `<h3 class="mt-lg">${this.string('quotientDetail')}</h3>` + detW + detSteps + detW;
			}

			copy() {
				if (!this.data) return;

				const t = this.data.total;
				const h = [this.string('party'), this.string('votes'), this.string('share'), this.string('hareSeatsHeader'), this.string('sainteLagueSeatsHeader'), this.string('diff')].join('\t');

				const lines = [h, ...this.data.results.map(res => [
					res.name,
					res.votes,
					this.format(res.votes / t * 100, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%',
					res.hare,
					res.sainteLague,
					res.sainteLague - res.hare
				].join('\t'))];

				const tsv = lines.join('\n');

				navigator.clipboard.writeText(tsv).then(() => {
					elements.copy.textContent = this.string('copied');
					setTimeout(() => elements.copy.textContent = this.string('copy'), 2000);
				});
			}

			export() {
				if (!this.data) return;

				const t = this.data.total;
				const h = [this.string('party'), this.string('votes'), this.string('share'), this.string('passedHeader'), this.string('hareSeatsHeader'), this.string('sainteLagueSeatsHeader'), this.string('differenceHeader')].join(',');

				const lines = [h, ...this.data.results.map(res => [
					`"${res.name.replace(/"/g, '""')}"`,
					res.votes,
					`"${this.format(res.votes / t * 100, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}"`,
					res.passed ? this.string('yes') : this.string('no'),
					res.hare,
					res.sainteLague,
					res.sainteLague - res.hare
				].join(','))];

				const csv = lines.join('\n');

				const a = document.createElement('a');
				a.href = URL.createObjectURL(new Blob(['\uFEFF', csv], { type: 'text/csv' }));
				a.download = `apportionment_${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.csv`;
				a.click();
			}
		}
		new ApportionmentCalc();
</script>
</body>
</html>
